syntax = "proto3";

package synaptica.client.v1;

service SynapticaService {
  // Execute a GQL query and return results.
  rpc ExecuteQuery(QueryRequest) returns (QueryResponse);

  // Execute a GQL query and stream results back.
  rpc ExecuteQueryStream(QueryRequest) returns (stream QueryResponse);

  // Begin an explicit transaction.
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);

  // Commit an explicit transaction.
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);

  // Rollback an explicit transaction.
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);

  // Health check.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Get cluster status information.
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);

  // List all node and edge labels with counts.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);

  // Get schema information (labels + property keys).
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);

  // List secondary indexes.
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);

  // Create a secondary index.
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse);

  // Drop a secondary index.
  rpc DropIndex(DropIndexRequest) returns (DropIndexResponse);

  // Get server metrics.
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);

  // List all available graphs.
  rpc ListGraphs(ListGraphsRequest) returns (ListGraphsResponse);

  // Create a backup (RocksDB checkpoint).
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);

  // List available backups.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);

  // Delete a backup.
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);

  // Export a graph as GQL statements.
  rpc ExportGraph(ExportGraphRequest) returns (stream ExportChunk);

  // Import GQL statements into a graph.
  rpc ImportGraph(ImportGraphRequest) returns (ImportGraphResponse);
}

message QueryRequest {
  string query = 1;
  string graph_name = 2;
  map<string, GqlValue> parameters = 3;
  optional string transaction_id = 4;
}

message QueryResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
  QueryStats stats = 3;
  optional string error = 4;
}

message Row {
  repeated GqlValue values = 1;
}

message GqlValue {
  oneof kind {
    bool null_value = 1;
    bool bool_value = 2;
    int64 integer_value = 3;
    double float_value = 4;
    string string_value = 5;
    bytes bytes_value = 6;
    GqlList list_value = 7;
    GqlMap map_value = 8;
    GqlNode node_value = 9;
    GqlEdge edge_value = 10;
  }
}

message GqlList {
  repeated GqlValue items = 1;
}

message GqlMap {
  map<string, GqlValue> entries = 1;
}

message GqlNode {
  string id = 1;
  repeated string labels = 2;
  map<string, GqlValue> properties = 3;
}

message GqlEdge {
  string id = 1;
  string label = 2;
  string source_id = 3;
  string target_id = 4;
  map<string, GqlValue> properties = 5;
}

message QueryStats {
  int64 nodes_created = 1;
  int64 nodes_deleted = 2;
  int64 edges_created = 3;
  int64 edges_deleted = 4;
  int64 properties_set = 5;
  int64 rows_returned = 6;
  int64 execution_time_ms = 7;
}

message BeginTransactionRequest {
  string graph_name = 1;
}

message BeginTransactionResponse {
  string transaction_id = 1;
}

message CommitTransactionRequest {
  string transaction_id = 1;
}

message CommitTransactionResponse {
  bool success = 1;
}

message RollbackTransactionRequest {
  string transaction_id = 1;
}

message RollbackTransactionResponse {
  bool success = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
  uint64 uptime_seconds = 3;
}

message ClusterStatusRequest {}

message ClusterStatusResponse {
  string node_id = 1;
  string role = 2;
  string leader_id = 3;
  repeated ClusterNode nodes = 4;
  int32 partition_count = 5;
}

message ClusterNode {
  string id = 1;
  string address = 2;
  string role = 3;
  bool is_healthy = 4;
}

message ListLabelsRequest {
  string graph_name = 1;
}

message ListLabelsResponse {
  repeated LabelInfo node_labels = 1;
  repeated LabelInfo edge_labels = 2;
}

message LabelInfo {
  string name = 1;
  int64 count = 2;
}

message GetSchemaRequest {
  string graph_name = 1;
}

message GetSchemaResponse {
  repeated LabelSchema node_schemas = 1;
  repeated LabelSchema edge_schemas = 2;
}

message LabelSchema {
  string label = 1;
  repeated string property_keys = 2;
  int64 count = 3;
}

message ListIndexesRequest {
  string graph_name = 1;
}

message ListIndexesResponse {
  repeated IndexInfo indexes = 1;
}

message IndexInfo {
  string name = 1;
  string entity_type = 2;
  repeated string property_names = 3;
  bool is_unique = 4;
}

message CreateIndexRequest {
  string graph_name = 1;
  string name = 2;
  string entity_type = 3;
  repeated string property_names = 4;
  bool is_unique = 5;
}

message CreateIndexResponse {
  bool success = 1;
  optional string error = 2;
}

message DropIndexRequest {
  string graph_name = 1;
  string name = 2;
}

message DropIndexResponse {
  bool success = 1;
  optional string error = 2;
}

message GetMetricsRequest {}

message GetMetricsResponse {
  map<string, double> gauges = 1;
  map<string, int64> counters = 2;
}

message ListGraphsRequest {}

message ListGraphsResponse {
  repeated GraphInfo graphs = 1;
}

message GraphInfo {
  string name = 1;
  string id = 2;
}

message CreateBackupRequest {
  string label = 1;
}

message CreateBackupResponse {
  string backup_name = 1;
  string created_at = 2;
}

message ListBackupsRequest {}

message ListBackupsResponse {
  repeated BackupInfo backups = 1;
}

message BackupInfo {
  string name = 1;
  string label = 2;
  string created_at = 3;
  uint64 size_bytes = 4;
}

message DeleteBackupRequest {
  string backup_name = 1;
}

message DeleteBackupResponse {
  bool success = 1;
  string message = 2;
}

message ExportGraphRequest {
  string graph_name = 1;
}

message ExportChunk {
  string data = 1;
}

message ImportGraphRequest {
  string graph_name = 1;
  string gql_data = 2;
}

message ImportGraphResponse {
  int64 statements_executed = 1;
  optional string error = 2;
}
