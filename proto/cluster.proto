syntax = "proto3";

package synaptica.cluster.v1;

service ClusterService {
  // Raft vote RPC — serialized openraft VoteRequest/VoteResponse.
  rpc Vote(RaftMessage) returns (RaftMessage);

  // Raft append entries RPC — serialized openraft AppendEntriesRequest/Response.
  rpc AppendEntries(RaftMessage) returns (RaftMessage);

  // Raft install snapshot RPC — serialized openraft InstallSnapshotRequest/Response.
  rpc InstallSnapshot(RaftMessage) returns (RaftMessage);

  // Forward a write query to the Raft leader for consensus.
  rpc ForwardWrite(ForwardWriteRequest) returns (ForwardWriteResponse);

  // Add a learner node to the Raft cluster.
  rpc AddLearner(AddLearnerRequest) returns (AddLearnerResponse);

  // Change cluster membership (promote learners to voters).
  rpc ChangeMembership(ChangeMembershipRequest) returns (ChangeMembershipResponse);
}

// Generic container for serialized openraft messages (bincode-encoded).
message RaftMessage {
  bytes data = 1;
}

// Forward a write query to the leader for Raft consensus.
message ForwardWriteRequest {
  string query = 1;
  string graph_name = 2;
}

message ForwardWriteResponse {
  bool success = 1;
  optional string error = 2;
  int64 rows_affected = 3;
}

// Add a learner (non-voting replica) to the cluster.
message AddLearnerRequest {
  uint64 node_id = 1;
  string address = 2;
}

message AddLearnerResponse {
  bool success = 1;
  optional string error = 2;
}

// Change cluster membership — set of voter node IDs.
message ChangeMembershipRequest {
  repeated uint64 voter_ids = 1;
}

message ChangeMembershipResponse {
  bool success = 1;
  optional string error = 2;
}
